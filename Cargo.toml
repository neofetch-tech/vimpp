[package]
name = "vimpp"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Vim++ — a millisecond-fast terminal editor with native Neovim-style Lua plugins."
license = "MIT"
readme = "README.md"
keywords = ["editor", "vim", "tui", "ratatui", "lua"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
ropey = "1.6"
unicode-width = "0.2"
mlua = { version = "0.10", features = ["lua51", "vendored"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

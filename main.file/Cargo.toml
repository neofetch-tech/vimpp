[package]
name = "vimpp"
version = "0.2.0"
edition = "2024"
build = "build.rs"
description = "A modal terminal editor with a C editing core, Rust UI, and Lua extensions"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
walkdir = "2.5"
unicode-width = "0.2"

[build-dependencies]
cc = "1.2"

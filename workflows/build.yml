name: Vim++ CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            asset: vimpp-linux-x86_64
            upload: vimpp-linux-x86_64
          - os: windows-latest
            label: Windows x86_64
            asset: vimpp-windows-x86_64
            upload: vimpp-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build optimized executable
        run: cargo build --release --locked
      - name: Prepare Linux release asset
        if: runner.os == 'Linux'
        run: cp target/release/vimpp vimpp-linux-x86_64
      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        run: Copy-Item target/release/vimpp.exe vimpp-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
